name: Compilar Toma (iOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto de Xcode
        run: xcodegen generate

      - name: Compilar (sin firma; Sideloadly la firma al instalar)
        run: |
          set -o pipefail
          xcodebuild \
            -project Toma.xcodeproj \
            -scheme Toma \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|\*\* BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Empaquetar IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Toma.app Payload/
          zip -qry Toma.ipa Payload

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: Toma-ipa
          path: Toma.ipa
          retention-days: 14

      - name: Subir registro de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
